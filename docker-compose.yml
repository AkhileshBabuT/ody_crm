services:
  postgres:
    image: postgres:16-alpine
    container_name: odyssey-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: odyssey_db
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d odyssey_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
